name: Vintage commerce foundation
on:
  push:
    branches: [foundation/vintage-commerce-v1]
    paths: ['apps/commerce/**', 'compose.foundation.yml', 'tsconfig.json', '.github/workflows/commerce-foundation.yml']
  pull_request:
    branches: [main]
    paths: ['apps/commerce/**', 'compose.foundation.yml', 'tsconfig.json', '.github/workflows/commerce-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vintage-foundation-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vintage
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: vintage_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vintage -d vintage_ci" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      NODE_ENV: test
      PORT: '9000'
      MEDUSA_WORKER_MODE: shared
      DISABLE_MEDUSA_ADMIN: 'false'
      MEDUSA_BACKEND_URL: http://localhost:9000
      DATABASE_URL: postgres://vintage:isolated_ci_only@localhost:5432/vintage_ci
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
      IFOOD_ENABLED: 'false'
      PAYMENTS_LIVE_ENABLED: 'false'
      ADS_EXPORT_ENABLED: 'false'
      VINTAGE_SLICE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/commerce/package-lock.json
      - name: Generate ephemeral test secrets
        run: |
          node <<'NODE'
          const fs = require("fs"), crypto = require("crypto");
          for (const name of ["JWT_SECRET", "COOKIE_SECRET"]) {
            const value = crypto.randomBytes(32).toString("hex");
            console.log("::add-mask::" + value);
            fs.appendFileSync(process.env.GITHUB_ENV, name + "=" + value + "\n");
          }
          NODE
      - name: Install backend dependencies
        working-directory: apps/commerce
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm audit --omit=dev --json > runtime-audit.json || true
          node -e 'const a=require("./runtime-audit.json");console.log("DEPENDENCY_AUDIT_REPORT",JSON.stringify(a.metadata?.vulnerabilities || a.error || {status:"unknown"}));if(!a.metadata || a.metadata.vulnerabilities.high || a.metadata.vulnerabilities.critical)process.exit(1)'
      - name: Unit tests and TypeScript
        working-directory: apps/commerce
        run: |
          npm run test:unit | tee unit-test-results.txt
          npm run typecheck
      - name: Apply migrations twice
        working-directory: apps/commerce
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Verify persistence, Redis lock and custom module
        working-directory: apps/commerce
        run: npm run smoke:modules
      - name: Build backend and admin
        working-directory: apps/commerce
        run: npm run build
      - name: Start compiled Medusa and test HTTP
        working-directory: apps/commerce
        run: |
          NODE_ENV=production npm --prefix .medusa/server run start > server.log 2>&1 &
          echo $! > /tmp/vintage-commerce.pid
          npm run smoke:http
      - name: Product combo cart freight and simulated order
        working-directory: apps/commerce
        run: |
          npx --no-install medusa exec ./src/scripts/smoke-commerce.ts | tee commerce-slice-results.txt
      - name: Verify Redis failure and recovery in readiness
        working-directory: apps/commerce
        run: |
          docker stop "${{ job.services.redis.id }}"
          npm run smoke:http -- unready
          docker start "${{ job.services.redis.id }}"
          npm run smoke:http
      - name: Restore isolated PostgreSQL backup and compare domain records
        run: |
          docker exec "${{ job.services.postgres.id }}" pg_dump -U vintage -Fc vintage_ci > /tmp/vintage-ci.dump
          docker exec "${{ job.services.postgres.id }}" createdb -U vintage vintage_restore
          docker exec -i "${{ job.services.postgres.id }}" pg_restore --exit-on-error -U vintage -d vintage_restore < /tmp/vintage-ci.dump
          for table in vintage_delivery_rule vintage_combo_definition vintage_combo_command vintage_commerce_event; do
            query="SELECT md5(COALESCE(string_agg(row_to_json(t)::text, '|' ORDER BY id),'')) FROM $table t"
            source_hash=$(docker exec "${{ job.services.postgres.id }}" psql -U vintage -d vintage_ci -Atc "$query")
            restored_hash=$(docker exec "${{ job.services.postgres.id }}" psql -U vintage -d vintage_restore -Atc "$query")
            test "$source_hash" = "$restored_hash"
            echo "ISOLATED_DOMAIN_RESTORE_PASS: $table"
          done
      - name: Preserve existing landing page build
        env:
          NODE_ENV: production
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build
      - name: Publish test evidence, never environment files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-evidence
          path: |
            apps/commerce/package-lock.json
            apps/commerce/unit-test-results.txt
            apps/commerce/runtime-audit.json
            apps/commerce/server.log
            apps/commerce/commerce-slice-results.txt
            apps/commerce/.cache/commerce-slice-report.json
          include-hidden-files: true
          retention-days: 7
      - name: Stop isolated processes
        if: always()
        run: |
          test ! -f /tmp/vintage-commerce.pid || kill "$(cat /tmp/vintage-commerce.pid)" || true
