name: Vintage commerce foundation
on:
  push:
    branches: [foundation/vintage-commerce-v1]
    paths: ['apps/commerce/**', 'compose.foundation.yml', 'tsconfig.json', '.github/workflows/commerce-foundation.yml']
  pull_request:
    branches: [main]
    paths: ['apps/commerce/**', 'compose.foundation.yml', 'tsconfig.json', '.github/workflows/commerce-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vintage-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vintage
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: vintage_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vintage -d vintage_ci" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      NODE_ENV: test
      PORT: '9000'
      MEDUSA_WORKER_MODE: shared
      DISABLE_MEDUSA_ADMIN: 'false'
      MEDUSA_BACKEND_URL: http://localhost:9000
      DATABASE_URL: postgres://vintage:isolated_ci_only@localhost:5432/vintage_ci
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
      IFOOD_ENABLED: 'false'
      PAYMENTS_LIVE_ENABLED: 'false'
      ADS_EXPORT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate ephemeral test secrets
        run: node -e 'const fs=require("fs"),c=require("crypto");fs.appendFileSync(process.env.GITHUB_ENV,["JWT_SECRET="+c.randomBytes(32).toString("hex"),"COOKIE_SECRET="+c.randomBytes(32).toString("hex")].join("\n")+"\n")'
      - name: Install backend dependencies
        working-directory: apps/commerce
        run: |
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm audit --omit=dev --json > runtime-audit.json || true
      - name: Unit tests and TypeScript
        working-directory: apps/commerce
        run: |
          npm run test:unit | tee unit-test-results.txt
          npm run typecheck
      - name: Apply migrations twice
        working-directory: apps/commerce
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Verify persistence, Redis lock and custom module
        working-directory: apps/commerce
        run: npm run smoke:modules
      - name: Build backend and admin
        working-directory: apps/commerce
        run: npm run build
      - name: Start compiled Medusa and test HTTP
        working-directory: apps/commerce
        run: |
          NODE_ENV=production npm --prefix .medusa/server run start > server.log 2>&1 &
          echo $! > /tmp/vintage-commerce.pid
          npm run smoke:http
      - name: Verify Redis failure is reflected in readiness
        working-directory: apps/commerce
        run: |
          docker stop "${{ job.services.redis.id }}"
          npm run smoke:http -- unready
          docker start "${{ job.services.redis.id }}"
      - name: Restore isolated PostgreSQL backup
        run: |
          docker exec "${{ job.services.postgres.id }}" pg_dump -U vintage -Fc vintage_ci > /tmp/vintage-ci.dump
          docker exec "${{ job.services.postgres.id }}" createdb -U vintage vintage_restore
          docker exec -i "${{ job.services.postgres.id }}" pg_restore --exit-on-error -U vintage -d vintage_restore < /tmp/vintage-ci.dump
          source_count=$(docker exec "${{ job.services.postgres.id }}" psql -U vintage -d vintage_ci -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          restored_count=$(docker exec "${{ job.services.postgres.id }}" psql -U vintage -d vintage_restore -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          test "$source_count" -gt 0
          test "$source_count" = "$restored_count"
          echo "ISOLATED_RESTORE_PASS: $source_count public tables"
      - name: Preserve existing landing page build
        env:
          NODE_ENV: production
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish test evidence, never environment files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-evidence
          path: |
            apps/commerce/package-lock.json
            apps/commerce/unit-test-results.txt
            apps/commerce/runtime-audit.json
            apps/commerce/server.log
          retention-days: 7
      - name: Stop isolated processes
        if: always()
        run: |
          test ! -f /tmp/vintage-commerce.pid || kill "$(cat /tmp/vintage-commerce.pid)" || true
  freeze-initial-lockfile:
    needs: foundation
    if: github.event_name == 'push' && github.ref == 'refs/heads/foundation/vintage-commerce-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/vintage-commerce-v1
      - uses: actions/download-artifact@v4
        with:
          name: foundation-evidence
          path: /tmp/foundation-evidence
      - name: Freeze only the tested initial dependency graph
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo 'Branch advanced; refusing concurrent write'; exit 1; }
          if test -f apps/commerce/package-lock.json; then echo 'Lockfile already tracked'; exit 0; fi
          cp /tmp/foundation-evidence/package-lock.json apps/commerce/package-lock.json
          node -e 'const p=require("./apps/commerce/package.json"),l=require("./apps/commerce/package-lock.json");if(l.name!==p.name||l.lockfileVersion!==3)process.exit(1);for(const [k,v] of Object.entries(p.dependencies))if(l.packages[""].dependencies[k]!==v)process.exit(1)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/commerce/package-lock.json
          git commit -m 'chore(commerce): freeze dependency graph validated by foundation CI'
          git push origin HEAD:refs/heads/foundation/vintage-commerce-v1
