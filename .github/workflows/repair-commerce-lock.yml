name: Repair commerce dependency lock
on:
  push:
    branches: [foundation/vintage-commerce-v1]
    paths: ['.github/workflows/repair-commerce-lock.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'emeverton/vintage_arcade' && github.ref == 'refs/heads/foundation/vintage-commerce-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize lockfile, then verify clean installation
        working-directory: apps/commerce
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --include=dev --no-audit --no-fund
          node <<'NODE'
          const p=require('./package.json'), l=require('./package-lock.json');
          for(const group of ['dependencies','devDependencies']) for(const [k,v] of Object.entries(p[group]||{})) if(l.packages[''][group][k]!==v) throw new Error('Manifest drift: '+k);
          for(const k of Object.keys(p.dependencies).filter(k=>k.startsWith('@medusajs/'))) if(l.packages['node_modules/'+k].version!=='2.21.0') throw new Error('Medusa version drift: '+k);
          NODE
      - name: Commit only normalized lockfile without force
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin foundation/vintage-commerce-v1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git diff --name-only)" = 'apps/commerce/package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/commerce/package-lock.json
          git commit -m 'fix(commerce): normalize lockfile verified with npm ci'
          git push origin HEAD:refs/heads/foundation/vintage-commerce-v1
